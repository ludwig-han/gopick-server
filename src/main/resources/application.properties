spring.application.name=gopick-server

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gopick}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

recommendation.ai.mode=${RECOMMENDATION_AI_MODE:stub}

upstage.api-key=${UPSTAGE_API_KEY:}
upstage.base-url=${UPSTAGE_BASE_URL:https://api.upstage.ai/v1}
upstage.model=${UPSTAGE_MODEL:solar-pro4}
